[project]
name = "resume-bench"
version = "0.1.0"
description = "ResumeExtractBench: a benchmark for structured resume extraction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
  "scipy>=1.11",
  "jellyfish>=1.0",
  "jsonschema>=4.21",
  "huggingface-hub>=0.23",
  "pymupdf>=1.24",
  "tenacity>=8.2",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
llamaextract = ["llama-cloud>=1.4"]
reducto = ["reductoai>=0.13"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
google = ["google-genai>=1.0"]
runners = [
  "resume-bench[llamaextract,reducto,openai,anthropic,google]",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis>=6",
  "respx",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit",
]

[project.scripts]
resume-bench = "resume_bench.cli:app"

[project.entry-points."resume_bench.providers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_bench"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires API keys and network access",
]
